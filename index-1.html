<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Моя музыка</title>
<meta name="theme-color" content="#04060e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Музыка">
<style>
:root{--bg:#f6f5fb;--card:#fff;--text:#16151d;--muted:#7a7890;--accent:#7c5cff;--accent2:#ff5c9d;--line:#e8e6f2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e15;--card:#1a1924;--text:#f1f0f8;--muted:#9391a8;--line:#2a2938;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0e15;--card:#1a1924;--text:#f1f0f8;--muted:#9391a8;--line:#2a2938;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#flux{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
svg{width:24px;height:24px;fill:currentColor;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 280px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:28px;margin:0;letter-spacing:-.5px}
.add{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}
#q{width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--text);font:inherit;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;cursor:pointer}
.row.on{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 16px rgba(0,222,255,.2)}
.cv{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.meta{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .t{color:var(--accent)}
.del{color:var(--muted);padding:8px;font-size:18px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.5}
.empty b{display:block;font-size:20px;color:var(--text);margin-bottom:6px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.player{position:fixed;left:0;right:0;bottom:0;background:rgba(10,12,22,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,255,255,.12);border-radius:24px 24px 0 0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.pin{max-width:560px;margin:0 auto}
.now{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.now .cv{width:56px;height:56px;font-size:22px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:2px 0 6px}
.ctl{display:flex;align-items:center;justify-content:space-between}
.ctl button{padding:10px;border-radius:50%;color:var(--text)}
.ctl .big{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:14px}
.ctl .big svg{width:28px;height:28px}
.tg{color:var(--muted)!important}
.tg.on{color:var(--accent)!important}
#rep{position:relative}
#rep[data-m="2"]::after{content:"1";position:absolute;right:6px;top:6px;font-size:10px;font-weight:700}
#fv{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px));color:#fff;transform:translateY(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
#fv.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.fvh{display:flex;align-items:center;justify-content:space-between}
.fvh button{padding:10px;color:#fff}
.tabs{display:flex;background:rgba(255,255,255,.18);border-radius:999px;padding:5px}
.tabs button{padding:8px 18px;border-radius:999px;font-weight:600;font-size:15px}
.tabs button.on{background:#fff;color:#111}
.fvb{flex:1;display:grid;place-items:center;min-height:0;padding:12px 0}
#fa{width:min(76vw,360px);aspect-ratio:1;object-fit:cover;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#vart.pz #fa{transform:scale(.88)}
#lyr{width:100%;height:100%;background:rgba(0,0,0,.18);border:0;border-radius:20px;color:#fff;font:inherit;font-size:18px;line-height:1.6;padding:16px;resize:none}
#lyr::placeholder{color:rgba(255,255,255,.6)}
#lyr[hidden],#vart[hidden]{display:none}
.fvt{display:flex;align-items:center;gap:12px}
.mqw{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
#ft{display:inline-block;font-size:26px;font-weight:800}
#ft.mq{animation:mq 9s linear infinite alternate}
@keyframes mq{0%,15%{transform:none}85%,100%{transform:translateX(var(--d))}}
#hb{color:#fff;padding:6px}
#hb.on svg{fill:#ff5c7a;stroke:#ff5c7a}
#fartist{color:rgba(255,255,255,.72);font-size:18px;margin:4px 0 18px}
#fv input[type=range]{accent-color:#fff}
#fv .tm{color:rgba(255,255,255,.7)}
#fv .ctl button{color:#fff}
#fv .ctl .big{background:none;border:2.5px solid #fff;padding:20px}
#md{position:relative}
#md[data-m='2']::after{content:'1';position:absolute;right:6px;top:6px;font-size:10px;font-weight:700}
#menu{position:absolute;right:16px;top:calc(64px + env(safe-area-inset-top,0px));background:rgba(20,20,28,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:6px;display:flex;flex-direction:column;z-index:2}
#menu[hidden]{display:none}
#menu button{padding:12px 16px;text-align:left;color:#fff;border-radius:10px;white-space:nowrap}
#menu button:active{background:rgba(255,255,255,.12)}
.now{cursor:pointer}
.add{position:relative;overflow:hidden;cursor:pointer;display:inline-block}
.add input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:rgba(20,20,28,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="flux"></canvas>
<div class="wrap">
  <header><h1>Моя музыка</h1><label class="add" id="add">+ Добавить<input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.flac" multiple></label></header>
  <input id="q" type="search" placeholder="Поиск по трекам">
  <div id="list"></div>
  <div class="note">Треки хранятся в памяти браузера на этом устройстве</div>
</div>
<div id="toast"></div>
<div class="player"><div class="pin">
  <div class="now"><div class="cv" id="pcv" style="background:var(--line)">♪</div>
    <div class="meta"><div class="t" id="pt">Ничего не играет</div><div class="a" id="pa">Добавь музыку с телефона</div></div></div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="tm"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="tg" id="shuf" aria-label="Перемешать"></button>
    <button id="prev" aria-label="Назад"></button>
    <button class="big" id="pp" aria-label="Играть"></button>
    <button id="next" aria-label="Вперёд"></button>
    <button class="tg" id="rep" data-m="0" aria-label="Повтор"></button>
  </div>
</div></div>
<div id='fv' aria-hidden='true'>
  <div class='fvh'>
    <button id='fvx' aria-label='Свернуть'></button>
    <div class='tabs'><button class='on' data-tab='art'>Обложка</button><button data-tab='lyr'>Текст</button></div>
    <button id='fvm' aria-label='Меню'></button>
  </div>
  <div id='menu' hidden><button id='mc'>Выбрать свою обложку</button><button id='mg'>Сгенерировать новую</button><button id='mdel'>Удалить трек</button></div>
  <div class='fvb'>
    <div id='vart' class='pz'><img id='fa' alt=''></div>
    <textarea id='lyr' placeholder='Вставь сюда текст песни. Он сохранится в памяти устройства.' hidden></textarea>
  </div>
  <div class='fvt'><div class='mqw'><span id='ft'></span></div><button id='hb' aria-label='В избранное'></button></div>
  <div id='fartist'></div>
  <input type='range' id='seek2' min='0' max='1000' value='0'>
  <div class='tm'><span id='cur2'>0:00</span><span id='dur2'>0:00</span></div>
  <div class='ctl'>
    <button id='md' aria-label='Режим'></button>
    <button id='prev2' aria-label='Назад'></button>
    <button class='big' id='pp2' aria-label='Играть'></button>
    <button id='next2' aria-label='Вперёд'></button>
    <button id='qb' aria-label='Список'></button>
  </div>
  <input type='file' id='imgf' accept='image/*' hidden>
</div>
<script>
const $=s=>document.querySelector(s);
const S='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const ic={
play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg>',
next:'<svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z"/></svg>',
shuf:'<svg viewBox="0 0 24 24" '+S+'><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
rep:'<svg viewBox="0 0 24 24" '+S+'><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>'};
$('#prev').innerHTML=ic.prev;$('#next').innerHTML=ic.next;$('#pp').innerHTML=ic.play;
$('#shuf').innerHTML=ic.shuf;$('#rep').innerHTML=ic.rep;

let db=null,tracks=[],cur=-1,shuffle=false,rep=0,url=null,drag=false,memId=1;
const audio=new Audio();

function openDB(){return new Promise((res,rej)=>{try{
  const r=indexedDB.open('music-offline',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
}catch(e){rej(e)}})}
function dbAll(){return new Promise((res,rej)=>{const q=db.transaction('t').objectStore('t').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbPut(rec){return new Promise((res,rej)=>{const q=db.transaction('t','readwrite').objectStore('t').add(rec);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbDel(id){return new Promise(res=>{const tx=db.transaction('t','readwrite');tx.objectStore('t').delete(id);tx.oncomplete=()=>res();tx.onerror=()=>res()})}

function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function grad(s){const h=hue(s);return 'linear-gradient(135deg,hsl('+h+' 80% 60%),hsl('+((h+50)%360)+' 80% 55%))'}
function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}

function parse(name){
  const n=name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  const p=n.split(' - ');
  return p.length>1?{artist:p[0],title:p.slice(1).join(' - ')}:{artist:'Неизвестный исполнитель',title:n};
}

function render(){
  const f=$('#q').value.trim().toLowerCase(),box=$('#list');
  box.innerHTML='';
  if(!tracks.length){
    box.innerHTML='<div class="empty"><b>Здесь пока тихо</b>Нажми «Добавить» и выбери аудиофайлы на телефоне. Они сохранятся и будут играть без интернета.</div>';
    return;
  }
  tracks.forEach((t,i)=>{
    if(f&&!(t.title+' '+t.artist).toLowerCase().includes(f))return;
    const r=document.createElement('div');r.className='row'+(i===cur?' on':'');
    const cv=document.createElement('div');cv.className='cv';setCv(cv,t);
    const m=document.createElement('div');m.className='meta';
    const a=document.createElement('div');a.className='t';a.textContent=t.title;
    const b=document.createElement('div');b.className='a';b.textContent=t.artist;
    m.append(a,b);
    const d=document.createElement('button');d.className='del';d.textContent='✕';d.setAttribute('aria-label','Удалить');
    d.onclick=e=>{e.stopPropagation();remove(i)};
    r.onclick=()=>{play(i);openFv()};
    r.append(cv,m,d);box.append(r);
  });
}

function play(i){
  if(i<0||i>=tracks.length)return;
  cur=i;const t=tracks[i];
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(t.blob);audio.src=url;
  audio.play().catch(()=>{});
  $('#pt').textContent=t.title;$('#pa').textContent=t.artist;
  setCv($('#pcv'),t);fvUpdate();
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
  }catch(e){}
  render();
}
function next(auto){
  if(!tracks.length)return;
  if(shuffle&&tracks.length>1){let n;do{n=Math.floor(Math.random()*tracks.length)}while(n===cur);return play(n)}
  const n=cur+1;
  if(n>=tracks.length){if(rep===1||!auto)return play(0);return audio.pause()}
  play(n);
}
function prev(){
  if(audio.currentTime>3||cur<=0){audio.currentTime=0;if(cur<0&&tracks.length)play(0);return}
  play(cur-1);
}
async function remove(i){
  const t=tracks[i];
  if(db&&t.id!=null)await dbDel(t.id);
  tracks.splice(i,1);
  if(i===cur){audio.pause();audio.removeAttribute('src');cur=-1;$('#pt').textContent='Ничего не играет';$('#pa').textContent='Выбери трек из списка'}
  else if(i<cur)cur--;
  render();
}
let tt=0;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
async function addFiles(files){
  let n=0;
  for(const f of files){
    const ok=/^(audio|video)\//.test(f.type)||f.type==='application/ogg'||!f.type||/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|wma|mp4|3gp|amr|weba)$/i.test(f.name);
    if(!ok)continue;
    try{
      const p=parse(f.name);const rec={title:p.title,artist:p.artist,blob:f,fav:false,lyrics:'',...genCover(p.title)};
      try{if(db)rec.id=await dbPut(rec);else rec.id=-(memId++)}catch(e){rec.id=-(memId++)}
      tracks.push(rec);n++;
    }catch(e){}
  }
  render();
  toast(n?'Добавлено: '+n:'Не удалось добавить файл');
  if(cur<0&&tracks.length)play(0);
}

audio.addEventListener('timeupdate',()=>{
  if(!drag&&audio.duration)$('#seek').value=audio.currentTime/audio.duration*1000;
  $('#cur').textContent=fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata',()=>{$('#dur').textContent=fmt(audio.duration)});
audio.addEventListener('play',()=>{$('#pp').innerHTML=ic.pause;try{navigator.mediaSession.playbackState='playing'}catch(e){}});
audio.addEventListener('pause',()=>{$('#pp').innerHTML=ic.play;try{navigator.mediaSession.playbackState='paused'}catch(e){}});
audio.addEventListener('ended',()=>{if(rep===2){audio.currentTime=0;audio.play()}else next(true)});

const seek=$('#seek');
seek.addEventListener('input',()=>{drag=true;if(audio.duration)$('#cur').textContent=fmt(seek.value/1000*audio.duration)});
seek.addEventListener('change',()=>{if(audio.duration)audio.currentTime=seek.value/1000*audio.duration;drag=false});

$('#pp').onclick=()=>{if(cur<0){if(tracks.length)play(0);else $('#file').click();return}audio.paused?audio.play():audio.pause()};
$('#next').onclick=()=>next(false);
$('#prev').onclick=prev;
$('#shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('#rep').onclick=e=>{rep=(rep+1)%3;const b=e.currentTarget;b.dataset.m=rep;b.classList.toggle('on',rep>0)};
$('#file').onchange=e=>{const fl=[...e.target.files];e.target.value='';if(fl.length)addFiles(fl)};
$('#q').oninput=render;

try{
  const ms=navigator.mediaSession;
  ms.setActionHandler('play',()=>audio.play());
  ms.setActionHandler('pause',()=>audio.pause());
  ms.setActionHandler('previoustrack',prev);
  ms.setActionHandler('nexttrack',()=>next(false));
}catch(e){}

/* Обложки и экран трека */
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
 return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function fromCanvas(c){const s=document.createElement('canvas');s.width=s.height=1;const x=s.getContext('2d');x.drawImage(c,0,0,1,1);const d=x.getImageData(0,0,1,1).data;return{cover:c.toDataURL('image/jpeg',.82),color:[d[0],d[1],d[2]]}}
function genCover(title,v){
 const R=rng(title+(v||'')),c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
 const h=R()*360,h2=(h+40+R()*80)%360;
 const g=x.createLinearGradient(0,0,512,512);g.addColorStop(0,`hsl(${h} 75% 55%)`);g.addColorStop(1,`hsl(${h2} 80% 35%)`);
 x.fillStyle=g;x.fillRect(0,0,512,512);
 for(let i=0;i<5;i++){const cx=R()*512,cy=R()*512,r=60+R()*180,hh=(h+R()*120)%360;const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,`hsla(${hh},90%,65%,.55)`);rg.addColorStop(1,`hsla(${hh},90%,65%,0)`);x.fillStyle=rg;x.fillRect(0,0,512,512)}
 x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;const ox=R()*512,oy=R()*512;
 for(let i=1;i<9;i++){x.beginPath();x.arc(ox,oy,i*34,0,7);x.stroke()}
 x.fillStyle='rgba(255,255,255,.88)';x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=30;x.font='700 230px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
 x.fillText((title[0]||'♪').toUpperCase(),256,276);
 return fromCanvas(c);
}
function imgToCover(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,512,512);URL.revokeObjectURL(u);res(fromCanvas(c))};im.onerror=()=>res(null);im.src=u})}
function setCv(el,t){if(t.cover){el.style.background='url('+t.cover+') center/cover';el.textContent=''}else{el.style.background=grad(t.title);el.textContent=(t.title[0]||'♪').toUpperCase()}}
function save(t){if(!db||!(t.id>0))return;try{const q=db.transaction('t','readwrite').objectStore('t').put(t);q.onerror=()=>{}}catch(e){}}

const I2={chev:'<svg viewBox="0 0 24 24" '+S+'><path d="M4 9l8 8 8-8"/></svg>',dots:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',heart:'<svg viewBox="0 0 24 24" '+S+'><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z"/></svg>',q:'<svg viewBox="0 0 24 24" '+S+'><path d="M4 6h16M4 12h16M4 18h10"/></svg>'};
$('#fvx').innerHTML=I2.chev;$('#fvm').innerHTML=I2.dots;$('#hb').innerHTML=I2.heart;$('#qb').innerHTML=I2.q;
$('#prev2').innerHTML=ic.prev;$('#next2').innerHTML=ic.next;$('#pp2').innerHTML=ic.play;

function openFv(){if(cur<0)return;$('#fv').classList.add('open');$('#fv').setAttribute('aria-hidden','false')}
function closeFv(){$('#fv').classList.remove('open');$('#fv').setAttribute('aria-hidden','true');$('#menu').hidden=true}
function fvUpdate(){
 const t=tracks[cur];if(!t)return;
 const c=t.color||[90,90,140];
 $('#fv').style.background=`linear-gradient(165deg,rgb(${c.map(v=>Math.round(v*.85))}),rgb(${c.map(v=>Math.round(v*.35))}))`;
 $('#fa').src=t.cover||'';
 $('#fartist').textContent=t.artist;
 const ft=$('#ft');ft.textContent=t.title;ft.classList.remove('mq');
 requestAnimationFrame(()=>{const d=ft.parentElement.clientWidth-ft.scrollWidth;if(d<0){ft.style.setProperty('--d',(d-12)+'px');ft.classList.add('mq')}});
 $('#hb').classList.toggle('on',!!t.fav);
 $('#lyr').value=t.lyrics||'';
}
function syncMode(){
 $('#shuf').classList.toggle('on',shuffle);
 const r=$('#rep');r.dataset.m=rep;r.classList.toggle('on',rep>0);
 const m=$('#md');m.innerHTML=shuffle?ic.shuf:ic.rep;m.dataset.m=(!shuffle&&rep===2)?2:0;m.style.opacity=(!shuffle&&rep===0)?.55:1;
}
syncMode();
$('#md').onclick=()=>{if(shuffle){shuffle=false;rep=0}else if(rep===0)rep=1;else if(rep===1)rep=2;else{shuffle=true;rep=1}syncMode()};
$('#shuf').addEventListener('click',syncMode);$('#rep').addEventListener('click',syncMode);

$('.now').onclick=openFv;
$('#fvx').onclick=closeFv;$('#qb').onclick=closeFv;
$('#pp2').onclick=()=>$('#pp').onclick();
$('#prev2').onclick=prev;$('#next2').onclick=()=>next(false);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 const l=b.dataset.tab==='lyr';$('#lyr').hidden=!l;$('#vart').hidden=l;
});
let lt=0;
$('#lyr').oninput=()=>{const t=tracks[cur];if(!t)return;t.lyrics=$('#lyr').value;clearTimeout(lt);lt=setTimeout(()=>save(t),500)};
$('#hb').onclick=()=>{const t=tracks[cur];if(!t)return;t.fav=!t.fav;save(t);$('#hb').classList.toggle('on',t.fav)};
$('#fvm').onclick=e=>{e.stopPropagation();$('#menu').hidden=!$('#menu').hidden};
$('#fv').addEventListener('click',()=>{$('#menu').hidden=true});
function refreshCv(t){save(t);fvUpdate();render();setCv($('#pcv'),t)}
$('#mc').onclick=()=>$('#imgf').click();
$('#imgf').onchange=async e=>{const f=e.target.files[0];e.target.value='';const t=tracks[cur];if(!f||!t)return;const r=await imgToCover(f);if(r){Object.assign(t,r);refreshCv(t)}};
$('#mg').onclick=()=>{const t=tracks[cur];if(!t)return;Object.assign(t,genCover(t.title,Math.random()));refreshCv(t)};
$('#mdel').onclick=()=>{const i=cur;closeFv();if(i>=0)remove(i)};

let drag2=false;const sk2=$('#seek2');
sk2.addEventListener('input',()=>{drag2=true;if(audio.duration)$('#cur2').textContent=fmt(sk2.value/1000*audio.duration)});
sk2.addEventListener('change',()=>{if(audio.duration)audio.currentTime=sk2.value/1000*audio.duration;drag2=false});
audio.addEventListener('timeupdate',()=>{if(!drag2&&audio.duration)sk2.value=audio.currentTime/audio.duration*1000;$('#cur2').textContent=fmt(audio.currentTime)});
audio.addEventListener('loadedmetadata',()=>{$('#dur2').textContent=fmt(audio.duration)});
audio.addEventListener('play',()=>{$('#pp2').innerHTML=ic.pause;$('#vart').classList.remove('pz')});
audio.addEventListener('pause',()=>{$('#pp2').innerHTML=ic.play;$('#vart').classList.add('pz')});

/* FluxLines: фон на WebGL-шейдере */
(function(){
const cv=document.getElementById('flux');
let gl=null;try{gl=cv.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'})}catch(e){}
if(!gl)return;
const C={colors:['#0061ff','#00deff','#000000'],glow:2,rimWidth:.2,lineWidth:1,speed:.5,scale:1.6,turbulence:1,fluidity:.1,sharpness:2.5,shimmer:1.5,mouseStrength:1,mouseRadius:.35};
const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const fs=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uR,uM;
uniform float uT,uGlow,uPow,uScale,uTurb,uShim,uMs,uRad,uRim,uIntro;
uniform vec3 c0,c1,c2;
float h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
void main(){
 vec2 uv=gl_FragCoord.xy/uR;
 vec2 p=(gl_FragCoord.xy-.5*uR)/uR.y;
 float t=uT;
 vec2 m=(uM*uR-.5*uR)/uR.y;
 vec2 d=p-m;float r=length(d);
 p+=d/(r+.02)*exp(-r*r/(uRad*uRad*.4))*.12*uMs;
 vec2 q=vec2(p.x*uScale*.9,p.y*uScale*.5+t);
 float w1=fbm(q)-.5;
 float w2=fbm(q*1.8+vec2(3.1,-t*.35)+w1*2.)-.5;
 float warp=(w1*1.1+w2*.9)*uTurb;
 vec3 acc=vec3(0.);
 for(int i=0;i<3;i++){
  float fi=float(i);
  float x=p.x*(15.+fi*8.)*uScale+warp*(5.+fi*3.)+fi*7.3+sin(t*.4+fi*2.)*.6;
  float l=1.-abs(fract(x)-.5)*2.;
  float ln=h(vec2(floor(x),fi));
  float sp=1.+uShim*.22*sin(t*(3.+ln*5.)+ln*40.);
  float core=pow(l,uPow*(1.+fi*.6))*sp;
  float halo=pow(l,3.);
  float pu=.5+.5*sin(p.y*(4.+fi*1.5)*uScale*.8+t*(1.6+fi*.5)+warp*7.+fi*2.1);
  pu=.3+.7*pu*pu;
  vec3 col=mix(c0,c1,clamp(.5+.6*sin(fi*1.9+p.y*2.2+warp*5.+t*.25),0.,1.));
  acc+=col*(core*1.5+halo*.1*uGlow)*pu*(.55+.45*ln)*(1.-fi*.25);
 }
 acc+=(c0*.5+c1*.5)*smoothstep(-.25,.35,warp)*.06*uGlow;
 acc+=mix(c0,c1,.5)*.10*pow(1.-uv.y,3.);
 vec3 o=1.-exp(-acc*1.3);
 float edge=min(min(uv.x,1.-uv.x),min(uv.y,1.-uv.y));
 o*=mix(.4,1.,smoothstep(0.,uRim,edge));
 o+=c2*.05+(h(gl_FragCoord.xy+fract(t))-.5)*.014;
 o*=smoothstep(0.,1.,uIntro*2.2-(1.-uv.y))*.82;
 gl_FragColor=vec4(o,1.);
}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return;
gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U={};['uR','uT','uM','uGlow','uPow','uScale','uTurb','uShim','uMs','uRad','uRim','uIntro','c0','c1','c2'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
const hex=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16)/255);
C.colors.forEach((c,i)=>gl.uniform3fv(U['c'+i],hex(c)));
gl.uniform1f(U.uScale,C.scale);gl.uniform1f(U.uTurb,C.turbulence);gl.uniform1f(U.uShim,C.shimmer);
gl.uniform1f(U.uRad,C.mouseRadius);gl.uniform1f(U.uRim,C.rimWidth);
gl.uniform1f(U.uPow,Math.max(2,C.sharpness*4/C.lineWidth));
function size(){const k=Math.min(devicePixelRatio||1,2)*.6;cv.width=Math.round(innerWidth*k);cv.height=Math.round(innerHeight*k);gl.viewport(0,0,cv.width,cv.height);gl.uniform2f(U.uR,cv.width,cv.height)}
size();addEventListener('resize',size);
/* касание только слегка раздвигает линии и плавно затухает, анимация не перезапускается */
const mt=[.5,.5],mc=[.5,.5];let down=false,lastMv=-99,ms=0,first=true;
function pos(e){mt[0]=e.clientX/innerWidth;mt[1]=1-e.clientY/innerHeight;lastMv=performance.now()/1000;if(first||(e.pointerType==='touch'&&!down)){mc[0]=mt[0];mc[1]=mt[1];first=false}}
addEventListener('pointermove',pos);
addEventListener('pointerdown',e=>{pos(e);down=true});
addEventListener('pointerup',e=>{down=false;if(e.pointerType==='touch')lastMv=-99});
addEventListener('pointercancel',()=>{down=false;lastMv=-99});
let T=0,boost=0;const start=performance.now()/1000;let last=start;
function frame(){
 const now=performance.now()/1000,dt=Math.min(now-last,.1);last=now;
 boost+=((audio.paused?0:1)-boost)*Math.min(1,dt*2);
 T+=dt*C.speed*(.7+.6*boost);
 const k=Math.min(1,dt*60*C.fluidity);mc[0]+=(mt[0]-mc[0])*k;mc[1]+=(mt[1]-mc[1])*k;
 ms+=(((down||now-lastMv<1.2)?1:0)-ms)*Math.min(1,dt*3);
 gl.uniform1f(U.uT,T);gl.uniform2f(U.uM,mc[0],mc[1]);gl.uniform1f(U.uMs,C.mouseStrength*ms);
 gl.uniform1f(U.uGlow,C.glow*(.8+.4*boost));
 gl.uniform1f(U.uIntro,Math.min(1,(now-start)/2.5));
 gl.drawArrays(gl.TRIANGLES,0,3);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
